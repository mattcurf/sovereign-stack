name: Cached container builds
description: Build runtime and builder images with pinned BuildKit and isolated layer caches.
runs:
  using: composite
  steps:
    - name: Set up pinned BuildKit
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      with:
        # Use only the checksum-verified Buildx installed by setup-tools.
        cache-binary: false
        driver-opts: image=moby/buildkit:v0.33.0@sha256:a461e7f0ce921972028acfbed628d45663d83e67ac1230722c2b34cf72760a0d
    - name: Build all images with GitHub cache v2
      uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
      with:
        source: .
        files: docker-bake.hcl
        load: true
        set: |
          base-container.cache-from=type=gha,version=2,scope=base-amd64-v1
          base-container.cache-to=type=gha,version=2,scope=base-amd64-v1,mode=max
          nginx.cache-from=type=gha,version=2,scope=nginx-amd64-v1
          nginx.cache-to=type=gha,version=2,scope=nginx-amd64-v1,mode=max
          rust.cache-from=type=gha,version=2,scope=rust-amd64-v1
          rust.cache-to=type=gha,version=2,scope=rust-amd64-v1,mode=max
          python.cache-from=type=gha,version=2,scope=python-amd64-v1
          python.cache-to=type=gha,version=2,scope=python-amd64-v1,mode=max
          base-container-builder.cache-from=type=gha,version=2,scope=base-builder-amd64-v1
          base-container-builder.cache-to=type=gha,version=2,scope=base-builder-amd64-v1,mode=max
          nginx-builder.cache-from=type=gha,version=2,scope=nginx-builder-amd64-v1
          nginx-builder.cache-to=type=gha,version=2,scope=nginx-builder-amd64-v1,mode=max
          rust-builder.cache-from=type=gha,version=2,scope=rust-builder-amd64-v1
          rust-builder.cache-to=type=gha,version=2,scope=rust-builder-amd64-v1,mode=max
          python-builder.cache-from=type=gha,version=2,scope=python-builder-amd64-v1
          python-builder.cache-to=type=gha,version=2,scope=python-builder-amd64-v1,mode=max
