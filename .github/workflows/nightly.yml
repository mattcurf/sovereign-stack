name: Nightly artifact audit
on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: nightly-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./tools/install.sh
      - run: echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
      - name: Verify and rescan every indexed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/nightly.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-evidence
          path: evidence/nightly/
          if-no-files-found: error
          retention-days: 90
