name: Publish signed stack
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: publish-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./tools/install.sh
      - run: echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
      - run: ./scripts/check.sh
      - run: ./scripts/build-images.sh
      - run: ./scripts/smoke-images.sh
      - run: ./scripts/scan-images.sh
      - name: Export gated images
        run: |
          mkdir -p build
          docker save -o build/images.tar sovereign-stack/base-container:local sovereign-stack/nginx:local sovereign-stack/rust:local sovereign-stack/python:local
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gated-images
          path: build/images.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 90
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write # Signed release inventories are the durable nightly index.
      packages: write
      id-token: write # Fulcio uses this job's GitHub Actions OIDC identity.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gated-images
          path: build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence
          path: evidence
      - run: ./tools/install.sh
      - run: echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
      - name: Publish, sign, attest, verify and index
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish.sh
